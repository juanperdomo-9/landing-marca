services:
  - type: web
    name: landing-marca
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Los archivos de dist/assets llevan un hash en el nombre: se pueden cachear para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
